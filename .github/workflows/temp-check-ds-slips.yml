name: Temporary practical slip execution check
on:
  push:
    branches:
      - improve-ds-slip-solutions
jobs:
  run-slip-programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: python -m pip install pandas scikit-learn matplotlib seaborn scipy mlxtend matplotlib-venn
      - name: Run all 25 slips with sample CSV fixtures
        run: python .github/workflows/check_ds_slips.py
